<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<title>Job Mailer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #F2F4F6; --paper: #FFFFFF; --ink: #1B2533; --muted: #5B6675;
    --line: #D5DBE2; --accent: #1F4E79; --accent-ink: #FFFFFF;
    --warn-bg: #FFF4DE; --warn-ink: #7A4B00; --ok: #1E6B4F; --err: #A12C2C;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171E; --paper: #1B222C; --ink: #E6EAEF; --muted: #9AA5B3;
      --line: #313B48; --accent: #7FB2E5; --accent-ink: #0E1A26;
      --warn-bg: #3A2C12; --warn-ink: #F3CF8A; --ok: #7FD1AE; --err: #F19A9A;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 640px; margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea, select {
    width: 100%; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  textarea { resize: vertical; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button {
    font: inherit; font-weight: 600; border-radius: 8px; padding: 12px 16px; cursor: pointer;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.link { border: none; background: none; color: var(--accent); padding: 8px 0; font-weight: 500; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .actions .primary { flex: 1; }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .status { padding: 12px 0; color: var(--muted); }
  .status.error { color: var(--err); }
  #preview { max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid var(--line); margin-top: 8px; }
  .warnings { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .warnings ul { margin: 0; padding-left: 18px; }

  /* The draft is shown as a letter: header lines like an envelope, body like paper. */
  .letter { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .letter .row { display: flex; align-items: center; border-bottom: 1px solid var(--line); padding: 0 12px; }
  .letter .row span { width: 64px; flex: none; font-size: 13px; color: var(--muted); }
  .letter .row input, .letter .row select { border: none; border-radius: 0; padding: 12px 0; background: transparent; }
  .letter textarea { border: none; border-radius: 0; min-height: 300px; padding: 14px 12px; line-height: 1.6; background: transparent; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .sent { text-align: center; padding: 48px 0; }
  .sent .tick { font-size: 40px; color: var(--ok); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>Job Mailer</h1>
    <button class="link" id="openSettings" type="button">Settings</button>
  </header>

  <section id="settings" hidden>
    <h2>Connect your backend</h2>
    <label for="scriptUrl">Apps Script web app URL</label>
    <input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="off">
    <p class="hint">Both are stored only on this phone.</p>
    <div class="actions"><button class="primary" id="saveSettings" type="button">Save settings</button></div>
  </section>

  <section id="input" hidden>
    <label for="postText">Job post text</label>
    <textarea id="postText" rows="6" placeholder="Share a post or screenshot to Job Mailer, or paste the post here"></textarea>
    <label for="imageInput">Screenshot</label>
    <input id="imageInput" type="file" accept="image/*">
    <img id="preview" alt="Shared screenshot" hidden>
    <label for="extra">Instruction for this email (optional)</label>
    <input id="extra" placeholder="e.g. mention I can join immediately">
    <div class="actions"><button class="primary" id="writeBtn" type="button">Write email</button></div>
  </section>

  <p id="status" class="status" role="status" hidden></p>

  <section id="draft" hidden>
    <div class="warnings" id="warnings" hidden><ul id="warningList"></ul></div>
    <div class="letter">
      <div class="row"><span>To</span><input id="to" type="email" placeholder="hr@company.com"></div>
      <div class="row"><span>Subject</span><input id="subject"></div>
      <div class="row"><span>CV</span><select id="cv"></select></div>
      <textarea id="body" aria-label="Email body"></textarea>
    </div>
    <div class="meta">
      <div><label for="company">Company</label><input id="company"></div>
      <div><label for="role">Role</label><input id="role"></div>
    </div>
    <label for="hrName">HR name</label>
    <input id="hrName">
    <div class="actions">
      <button class="primary" id="sendBtn" type="button">Send email</button>
      <button id="rewriteBtn" type="button">Rewrite</button>
    </div>
    <button class="link" id="startOver" type="button">Start over</button>
  </section>

  <section id="sent" class="sent" hidden>
    <div class="tick" aria-hidden="true">✓</div>
    <h2 id="sentTitle">Sent</h2>
    <p class="hint" id="sentInfo"></p>
    <div class="actions" style="justify-content:center"><button class="primary" id="doneBtn" type="button">Done</button></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
